<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study System - Login</title>
    <link rel="stylesheet" href="/static/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>AI Study System</h1>
            <p>Collaborative Learning Platform</p>
        </div>

        <div class="auth-tabs">
            <button id="loginTab" class="tab-button active">Login</button>
            <button id="registerTab" class="tab-button">Register</button>
        </div>

        <!-- Login Form -->
        <div id="loginForm" class="auth-form active">
            <h2>Welcome Back</h2>
            <form id="loginFormElement">
                <div class="form-group">
                    <label for="loginUsername">Username or Email</label>
                    <input type="text" id="loginUsername" name="username" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" required>
                </div>

                <button type="submit" class="auth-button">Login</button>
            </form>

            <div id="loginMessage" class="message"></div>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="auth-form">
            <h2>Join the Community</h2>
            <form id="registerFormElement">
                <div class="form-group">
                    <label for="registerUsername">Username</label>
                    <input type="text" id="registerUsername" name="username" required minlength="3">
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" name="email" required>
                </div>

                <div class="form-group">
                    <label for="registerFullName">Full Name (Optional)</label>
                    <input type="text" id="registerFullName" name="full_name">
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" name="password" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="registerConfirmPassword">Confirm Password</label>
                    <input type="password" id="registerConfirmPassword" name="confirm_password" required minlength="6">
                </div>

                <button type="submit" class="auth-button">Create Account</button>
            </form>

            <div id="registerMessage" class="message"></div>
        </div>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="loading-overlay">
            <div class="spinner"></div>
            <p>Processing...</p>
        </div>
    </div>

    <script src="/static/auth.js"></script>
</body>
</html>
